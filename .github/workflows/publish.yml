name: Publish package to the Maven Central Repository
on:
  workflow_dispatch:
  push:
    tags:
      - v*
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'adopt'
      - uses: extractions/setup-just@v2
      - name: setup jreleaser
        uses: sfesenko/setup-sdkman@v1
        with:
          deps: jreleaser
      - name: setup jstage
        run:
          bash < <(curl -s https://raw.githubusercontent.com/bowbahdoe/jstage/main/install)
      - name: setup jresolve
        run:
          bash < <(curl -s https://raw.githubusercontent.com/bowbahdoe/jresolve-cli/main/install)
      - name: get dependencies
        run: just install
      - name: Publish package
        env:
          JRELEASER_MAVENCENTRAL_TOKEN: ${{ secrets.JRELEASER_MAVENCENTRAL_TOKEN }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.JRELEASER_MAVENCENTRAL_USERNAME }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just deploy